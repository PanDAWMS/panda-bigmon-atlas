<div mat-dialog-content >
  <section style="max-height: 800px; overflow: auto;">
<app-rucio-did [datasetName]="currentDataset" [showStaging]="true" >  </app-rucio-did>
  </section>
</div>
<mat-dialog-actions align="end">
  <button mat-button [disabled]="currentIndex === 0" (click)="previousTask()" >Previous</button>
  <button mat-button [disabled]="currentIndex === (data.filteredDatasets.length - 1)"  (click)="nextTask()">Next</button>
  <button mat-button mat-dialog-close>Exit</button>

</mat-dialog-actions>
