<div class="mb-4">
  <h3 class="text-lg font-semibold">
    Output: {{ outputType() }} | AMI tag: {{ amiTag() }}
  </h3>
</div>

@if (isLoading) {
  <div class="flex justify-center items-center" style="height: 480px;">
    <mat-spinner></mat-spinner>
  </div>
} @else {
  <ag-grid-angular
    class="ag-theme-alpine"
    style="width: 100%;"
    domLayout="autoHeight"
    [rowData]="containers"
    [columnDefs]="columnDefs"
    rowSelection="multiple"
    [suppressRowClickSelection]="true"
    [pagination]="true"
    [paginationPageSize]="20"
    (firstDataRendered)="autoSizeColumns($event)"
    (rowDataUpdated)="autoSizeColumns($event)"
  (selectionChanged)="onSelectionChanged($event)">
  </ag-grid-angular>
}

<div class="mt-2">Selected containers: {{selectedContainers.length}}</div>

<div class="mt-4 flex flex-wrap gap-4 items-start">
  <mat-form-field>
    <mat-label>Number of extensions</mat-label>
    <input matInput type="number" [(ngModel)]="numberOfExtensions">
  </mat-form-field>

  <mat-form-field class="flex-1 min-w-80">
    <mat-label>Comment</mat-label>
    <input matInput type="text" [(ngModel)]="comment">
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="askForExtension(selectedContainers, numberOfExtensions, comment)"
    [disabled]="isSubmittingExtension || selectedContainers.length === 0 || numberOfExtensions == 0 || !comment"
  >
    Ask for extension
  </button>
</div>

@if (extensionRequestResult) {
  <div class="mt-3 text-sm text-green-700">
    {{ extensionRequestResult }}
  </div>
}

@if (extensionRequestError) {
  <div class="mt-3 text-sm text-red-700">
    {{ extensionRequestError }}
  </div>
}
