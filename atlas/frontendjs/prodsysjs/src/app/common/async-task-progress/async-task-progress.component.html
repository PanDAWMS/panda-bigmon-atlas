
@if (active){
  <div>
    <mat-spinner [diameter]="20"></mat-spinner>
    @if(total>0){
      @switch (asyncTaskType()){
        @case('single') {
          Executing ...
        }
        @default {
          Done : {{current}} / {{total}}
          <mat-progress-bar mode="determinate" [value]="100*current/total"></mat-progress-bar>
        }
      }
    } @else {
      Sending ...
    }
  </div>
} @else if (!finished) {
<span>Initialising async tasks...</span>
}
